<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDF SOLAIRES - Analyse Financiere</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding:40px;color:#ef4444;background:#09090b;font-family:sans-serif;min-height:100vh;box-sizing:border-box;">' +
            '<h2 style="margin-bottom:12px;">⚠️ Erreur au chargement du script</h2>' +
            '<div style="background:#18181b;padding:16px;border-radius:8px;border:1px solid #ef4444;color:#fca5a5;font-family:monospace;font-size:14px;word-break:break-all;">' +
            (event.message || 'Erreur inconnue') +
            '</div>' +
            '<p style="color:#71717a;font-size:12px;margin-top:8px;">' + (event.filename || '') + ':' + (event.lineno || '') + '</p>' +
            '</div>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>

    <script>
      window.Recharts = window.Recharts || {};
    </script>

    <!-- ⭐ NOUVEAU : Script pour supprimer les warnings ⭐ -->
    <script>
      const originalWarn = console.warn;
      console.warn = function (...args) {
        if (
          args[0] &&
          typeof args[0] === "string" &&
          args[0].includes("width(-1) and height(-1)")
        ) {
          return;
        }
        originalWarn.apply(console, args);
      };
      setTimeout(() => {
        if (window.dispatchEvent) {
          window.dispatchEvent(new Event("resize"));
        }
      }, 2000);
    </script>
  </body>
</html>
